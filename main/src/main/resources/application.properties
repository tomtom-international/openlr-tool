# Local-development defaults, on the classpath.
#
# The Docker deployment does NOT use this file: docker-compose sets
# SPRING_CONFIG_LOCATION=file:/app/config/application.properties, which bind-mounts
# ./config from the repository root. Edit that one to change a running container.
#
# A third source, main/src/main/resources/application.yml, used to sit alongside this
# file declaring an `openlr.*` tree, a datasource on localhost, and server.port 8080.
# None of it was read -- the code binds six flat keys, listed at the bottom of this
# file -- so it was removed rather than left to be edited by mistake.
# OpenLR WebTool - PostgreSQL Configuration
application.title=OpenLR WebTool - PostgreSQL
application.version=v0.1.0
server.max-http-header-size=256KB

# Server port
server.port=8081

# Logging configuration
logging.level.org.springframework.web=WARN
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate=ERROR
logging.level.com.tomtom.openlr.webtool=DEBUG
logging.level.openlr=DEBUG

# PostgreSQL MapDatabase profile
spring.profiles.active=generic_pg_mapdb

# Database connection settings
# Local development connects to a database on the host. The Docker deployment uses
# the 'postgres' service name, set in config/application.properties.
spring.datasource.url=jdbc:postgresql://localhost:5432/openlr_db
spring.datasource.username=openlr
spring.datasource.password=openlrpwd
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# OpenLR configuration directories
decoder_properties_dir=${user.dir}/config/decoding_properties
encoding_properties_dir=${user.dir}/config/encoding_properties

# Database schema and table names
db_schema=local
roads_table=roads
intersections_table=intersections

# Cache settings
cache_size=1000000

#---------------------------------------------------------#
# The only keys the application code reads directly:      #
#   db_schema, roads_table, intersections_table           #
#   decoder_properties_dir, encoding_properties_dir       #
#   cache_size                                            #
# Everything else above is standard Spring Boot config.   #
#---------------------------------------------------------#
